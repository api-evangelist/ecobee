aid: ecobee
url: https://raw.githubusercontent.com/api-evangelist/ecobee/refs/heads/main/apis.yml
name: ecobee
kind: company
description: ecobee makes smart Wi-Fi thermostats, room sensors, cameras, and other
  connected home devices. The ecobee API is a REST-like JSON interface, based at
  https://api.ecobee.com/1/, that lets authorized third-party applications read and
  control registered ecobee thermostats - retrieving live runtime state, settings,
  sensors, and equipment status, updating programs and comfort settings via thermostat
  functions, pulling historical runtime and meter reports, grouping thermostats, and
  (for EMS and Utility accounts) organizing thermostats in a management-set hierarchy
  and issuing demand response events. Authorization uses OAuth 2.0 with an ecobee PIN
  flow or the standard authorization-code flow, plus refresh tokens. NOTE - as of late
  2024 ecobee closed its developer program to new API-key registrations; existing keys
  continue to function.
