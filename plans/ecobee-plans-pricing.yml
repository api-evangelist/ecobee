specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: ecobee
providerId: ecobee
created: '2026-07-03'
modified: '2026-07-03'
reconciled: false
tags:
- Smart Home
- Thermostat
- IoT
- Energy
- Plans
description: >-
  The ecobee API has historically been offered as a free developer program - a
  developer registers a free ecobee account, creates an application, receives an
  application (API) key, and then accesses only thermostats that end users
  authorize via the OAuth PIN or authorization-code flow. There is no published
  metered fee for calling the API; access is governed by scopes (smartRead,
  smartWrite, ems) and account type (Smart consumer accounts vs EMS/Utility
  accounts). IMPORTANT - as of late 2024, ecobee closed the consumer developer
  program to new API-key registrations; existing keys continue to work, and
  EMS/Utility (commercial energy) programs are handled through ecobee sales
  rather than open self-serve signup.
notes: >-
  ecobee does not publish per-call API pricing. The commercial relationship for
  EMS and Utility (demand response, hierarchy, meter reports) is negotiated with
  ecobee. Verify current developer-program availability before planning a new
  integration, since new consumer API-key registration is closed.
sources:
- https://www.ecobee.com/en-us/developers/
- https://www.ecobee.com/home/developer/api/introduction/index.shtml
- https://www.ecobee.com/home/developer/api/documentation/v1/auth/auth-intro.shtml
plans:
- id: ecobee-developer-free
  name: Developer Program (Free)
  type: free
  description: >-
    Free access to the ecobee API for authorized third-party applications.
    Requires a free ecobee account and an application key; the app can only read
    and control thermostats that end users have explicitly authorized. No
    per-call fee is published. NOTE - closed to new API-key registrations as of
    late 2024; existing keys still function.
  entries:
  - label: API Access
    name: api_access
    type: usage
    metric: requests
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: free (no published per-call fee)
    userMultiplied: false
  elements:
  - name: Thermostat Read (smartRead)
  - name: Thermostat Write and Functions (smartWrite)
  - name: Runtime Report
  - name: Group Management
  - name: OAuth PIN and Authorization Code Flows
- id: ecobee-ems-utility
  name: EMS / Utility (Commercial)
  type: enterprise
  description: >-
    Commercial access for EMS (Energy Management System) and Utility accounts,
    enabling the management-set hierarchy, demand response events, and meter
    reports across fleets of thermostats. Provisioned through an agreement with
    ecobee rather than open self-serve signup.
  entries:
  - label: Commercial Agreement
    name: commercial
    type: flat
    metric: contract
    limit: -1
    timeFrame: year
    geo: global
    unit: 1
    price: contact ecobee
    userMultiplied: false
  elements:
  - name: Management Set Hierarchy
  - name: Demand Response
  - name: Meter Reports
  - name: ems Scope
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
