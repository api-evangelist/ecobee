description: >-
  FinOps view of ecobee API spend. The ecobee developer API has historically
  been free to use - there is no published per-call fee - so for consumer
  (Smart-account) integrations the direct API cost is effectively zero and the
  real cost drivers are engineering, maintenance, and the operational risk that
  the developer program is closed to new registrations. For EMS and Utility
  programs (demand response, hierarchy, meter reports), cost is governed by a
  commercial agreement with ecobee rather than usage-metered API billing.
notes: >-
  ecobee does not invoice per API call, so there is no usage-based line item to
  reconcile for the standard developer program. Model cost as build-and-maintain
  effort plus, for EMS/Utility, the negotiated commercial contract. Account for
  program-availability risk: new consumer API keys are no longer being issued.
