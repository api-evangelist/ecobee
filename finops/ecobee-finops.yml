meters:
- name: api_requests
  description: Calls to the ecobee API. Not billed - included in the free developer program.
  unit: requests
  aggregation: sum
  dimensions:
  - application
  - account
- name: authorized_thermostats
  description: Number of end-user thermostats an application is authorized to access; a proxy for integration scale, not a billed meter.
  unit: devices
  aggregation: max
  dimensions:
  - application
- name: ems_commercial_contract
  description: Negotiated EMS/Utility commercial agreement for hierarchy, demand response, and meter reports.
  unit: contract
  aggregation: max
  dimensions:
  - account
principles:
- name: Visibility
  description: Track how many thermostats each application is authorized to access and the polling volume, even though calls are not billed, to manage rate-limit and support risk.
- name: Allocation
  description: Attribute integration engineering and maintenance effort to the product or team that owns the ecobee connection.
- name: Optimization
  description: Poll efficiently via thermostatSummary revisions to stay within rate guidance and reduce compute; batch report requests within the 25-thermostat / 31-day limits.
- name: Accountability
  description: Own the program-availability risk - new consumer API keys are closed - and, for EMS/Utility, review the commercial contract terms with ecobee.
